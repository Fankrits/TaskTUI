name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: tasktui
            use_cross: false

          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: tasktui
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: tasktui
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: tasktui
            use_cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: tasktui.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build binary with cross
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="tasktui-${TAG}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" ./
          tar -czf "$ARCHIVE_NAME" "${{ matrix.bin_name }}" README.md LICENSE
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="tasktui-${TAG}-${{ matrix.target }}.zip"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" ./
          7z a "$ARCHIVE_NAME" "${{ matrix.bin_name }}" README.md LICENSE
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Generate Checksum (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          shasum -a 256 "$ARCHIVE_PATH" > "${ARCHIVE_PATH}.sha256"

      - name: Generate Checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          sha256sum "$ARCHIVE_PATH" > "${ARCHIVE_PATH}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums file
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt || true
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            install.sh
            install.ps1
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

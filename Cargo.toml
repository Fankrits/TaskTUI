[package]
name = "tasktui"
version = "0.1.0"
edition = "2024"
authors = ["Fankrits <fankritsadajra@gmail.com>"]
description = "A blazing-fast, lightweight, and modern terminal task manager and system monitor built with Rust and Ratatui."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Fankrits/TaskTUI"
keywords = ["tui", "system-monitor", "task-manager", "process-viewer", "ratatui"]
categories = ["command-line-utilities", "system::monitoring"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
netstat2 = "0.11.2"
# `layout-cache` is part of ratatui's default features. Disabling defaults to
# trim the widget set also switched it off, which made every Layout::split
# re-run the constraint solver (~300 allocations each, ~20 per frame). Keep it
# on explicitly.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk", "user"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
